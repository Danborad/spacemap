services:
  spacemap:
    build: .
    container_name: spacemap
    restart: unless-stopped
    ports:
      - "7080:7080"
    volumes:
      - ./data:/app/data
      - /vol1/1000/share1:/vol1/1000/share1:ro
    environment:
      - PORT=7080
      - DATA_DIR=/app/data
      - TRIM_DATA_SHARE_PATHS=/vol1/1000/share1
    network_mode: host
